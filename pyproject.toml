[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yosoku"
version = "0.1.0"
description = "日本株トレーディングセンサー: 適時開示・ニュースを取り込み、Claudeで判定しDiscordに通知する"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "requests>=2.31",
    "feedparser>=6.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
# yfinance(pandas/numpy 等を含む重い依存)は任意。値動きコンテキスト/バックテスト
# でのみ使用。速報・通知の中核機能はこれ無しで動く。
prices = ["yfinance>=0.2.40"]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "yfinance>=0.2.40",
]

[project.scripts]
yosoku = "yosoku.cli:main"

[tool.setuptools.packages.find]
include = ["yosoku*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
