# yosoku を GitHub Actions 上で「ほぼ常時」動かすワークフロー。
#
# 仕組み(GitHubで最速にする工夫):
#  - 1回のジョブで watch を最大5.5時間まわし、60秒ごとに監視する。
#  - 5.5時間でクリーンに終了 → 状態(重複DB)をキャッシュ保存。
#  - schedule が次のジョブを積む(concurrency で実行中はキュー)。これで
#    5.5時間ジョブが連鎖し、ほぼ切れ目なく60秒間隔の監視になる。
#  - 公開リポジトリなので GitHub Actions の実行時間は無制限(無料)。
#
# 使い方(ブラウザだけ):
#  1) Settings → Secrets and variables → Actions に
#     ANTHROPIC_API_KEY と DISCORD_WEBHOOK_URL を登録(任意で YOSOKU_MODEL)。
#  2) Actions タブ →「yosoku-sensor」→「Run workflow」で最初の長時間ジョブを起動。
#  3) 状態DBは actions/cache で引き継ぎ、再通知を防ぐ。

name: yosoku-sensor

on:
  schedule:
    - cron: "*/15 * * * *"   # 15分ごとに次ジョブを積む(実行中はキューされ連鎖)
  workflow_dispatch: {}        # 手動で最初の長時間ジョブを起動

# 実行中は新しいトリガをキューに積む(キャンセルしない)。
# → 長時間ジョブが終わると次が即開始し、ほぼ常時稼働になる。
concurrency:
  group: yosoku-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub の上限6時間より短く
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      # Secret の存在チェック。空だと通知/分析が静かに死ぬため、run ページに
      # 警告(annotation)として目立たせる。値そのものは一切出力しない。
      - name: Check secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY が未設定です。AI分析が動きません。Settings → Secrets and variables → Actions で登録してください。"
          else
            echo "ANTHROPIC_API_KEY: 設定済み"
          fi
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL が未設定です。通知が一切届きません。Settings → Secrets and variables → Actions で登録してください。"
          else
            echo "DISCORD_WEBHOOK_URL: 設定済み"
          fi

      # 状態DB(重複管理)を引き継ぐローリングキャッシュ。
      # watch がクリーン終了すると post ステップで保存される。
      - name: Cache state
        uses: actions/cache@v4
        with:
          path: yosoku_state.db
          key: yosoku-state-${{ github.run_id }}
          restore-keys: |
            yosoku-state-

      # 答え合わせ: 採点窓に入った過去通知を後刻の株価で採点する(APIキー不要・株価のみ)。
      # ジョブ起動ごと(約5.5hおき)に走り、結果は同じ状態DBに蓄積される。失敗しても続行。
      - name: Score outcomes
        continue-on-error: true
        run: python -m yosoku score

      # 60秒間隔で監視し、5.5時間(19800秒)でクリーン終了 → 次ジョブへ連鎖。
      - name: Watch (long-running)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YOSOKU_MODEL: ${{ secrets.YOSOKU_MODEL }}
        run: python -m yosoku watch --interval 60 --max-runtime 19800
