# config.yaml の例。`--config config.yaml` で読み込む。
# シークレット(APIキー/Webhook)はここには書かず、環境変数で渡すこと。

# 精査(deep)に使うモデル(環境変数 YOSOKU_MODEL でも上書き可)
model: claude-opus-4-8

store_path: yosoku_state.db   # 重複管理・履歴 DB
poll_interval: 300            # watch のポーリング間隔(秒)

tdnet:
  enabled: true
  limit: 50
  watchlist: []               # 例: ["7203", "6758", "9984"](空なら全開示)

news:
  enabled: true
  feeds:
    - https://www.nhk.or.jp/rss/news/cat5.xml   # NHK 経済
    # - https://example.com/your-feed.xml

analysis:
  # --- 通知しきい値 ---
  score_threshold: 60         # bullish スコアの最低値(0〜100)
  confidence_threshold: 50    # 確信度の最低値(0〜100)
  notify_tickerless: false    # 銘柄不明のニュースでも通知するか

  # --- 文脈づけ ---
  enable_price_context: true  # yfinance の直近値動きを精査に添える
  fetch_document: true        # 開示PDF本文を抽出して精査に渡す(精度↑)
  max_document_chars: 6000
  enable_web_context: false   # Web検索で追加文脈(実験的・コスト増)

  # --- 二段階分析(triage → deep) ---
  two_stage: true             # false にすると全件を deep モデルで分析(高コスト)
  triage_model: claude-haiku-4-5
  triage_escalate_score: 30   # triage でこのスコア以上なら deep へ昇格
  deep_thinking: true         # 精査で adaptive thinking を使う

  # --- 実行制御 ---
  concurrency: 6              # 同時分析数
  max_retries: 4
  request_timeout: 60

  # --- 一次キーワードフィルタ(空にすると全開示を分析=コスト増) ---
  relevance_keywords:
    - 決算
    - 業績予想
    - 上方修正
    - 増配
    - 自己株式
    - 公開買付
    - TOB
    - 業務提携
    - 受注
